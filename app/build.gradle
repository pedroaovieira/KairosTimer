plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'org.pedrov.kairostimer'
    compileSdk 35

    defaultConfig {
        applicationId "org.pedrov.kairostimer"
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName "1.4.2"
    }

    // Signing credentials are loaded from keystore.properties (gitignored) or,
    // failing that, environment variables — intentionally NOT hardcoded here.
    def keystorePropsFile = rootProject.file("keystore.properties")
    def keystoreProps = new Properties()
    if (keystorePropsFile.exists()) {
        keystoreProps.load(new FileInputStream(keystorePropsFile))
    }
    def releaseStoreFile = keystoreProps.getProperty("storeFile") ?: System.getenv("KAIROS_STORE_FILE")
    def releaseStorePassword = keystoreProps.getProperty("storePassword") ?: System.getenv("KAIROS_STORE_PASSWORD")
    def releaseKeyAlias = keystoreProps.getProperty("keyAlias") ?: System.getenv("KAIROS_KEY_ALIAS")
    def releaseKeyPassword = keystoreProps.getProperty("keyPassword") ?: System.getenv("KAIROS_KEY_PASSWORD")
    def hasReleaseSigning = releaseStoreFile != null

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "KairosTimer.apk"
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
}
